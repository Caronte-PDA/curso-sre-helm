# ~/Documentos/terra/k8s-master/mi-nginx-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app: webserver
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      labels:
        app: webserver
    spec:
      # EL PRECALENTAMIENTO: Contenedores que corren antes de la aplicación principal
      {{- if .Values.initContainer.enabled }}
      initContainers:
      - name: init-check
        image: "{{ .Values.initContainer.image }}"
        command: {{ toYaml .Values.initContainer.command | nindent 8 }}
      {{- end }}

      # EL PARTIDO PRINCIPAL: Nuestra aplicación web
      containers:
      - name: nginx-container
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.port }}
        
        {{- if .Values.database.enabled }}
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-db-credentials
        {{- end }}

        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.probes.liveness.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: {{ .Values.probes.readiness.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      
      volumes:
      - name: html-volume
        configMap:
          name: {{ .Release.Name }}-nginx-cm
      {{- if .Values.persistence.enabled }}
      - name: data-volume
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-nginx-pvc
      {{- end }}
