# ~/Documentos/terra/k8s-master/mi-nginx-chart/templates/secret.yaml
{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
type: Opaque
data:
  # Helm codificará estos valores a Base64 automáticamente
  DB_NAME: {{ .Values.database.name | b64enc | quote }}
  DB_USER: {{ .Values.database.user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.database.password | b64enc | quote }}
{{- end }}
