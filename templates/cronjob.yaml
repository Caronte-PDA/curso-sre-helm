# ~/Documentos/terra/k8s-master/mi-nginx-chart/templates/cronjob.yaml
{{- if .Values.scraperCron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-bolsa-scraper
  labels:
    app: scraper
spec:
  schedule: "{{ .Values.scraperCron.schedule }}"
  
  # LA REGLA SRE DE LIMPIEZA VISUAL (Mantenemos ArgoCD impecable)
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scraper
        spec:
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: scraper
            image: "{{ .Values.scraperCron.image }}"
            command:
            - /bin/sh
            - -c
            - "echo 'Extrayendo datos de la Bolsa de Santiago...'; sleep 5; echo 'Datos bursátiles actualizados con éxito.'"
          restartPolicy: OnFailure
{{- end }}
