# ~/Documentos/terra/k8s-master/mi-nginx-chart/values.yaml
replicaCount: 2

image:
  repository: nginx
  tag: "1.25.4"

service:
  port: 80

resources:
  requests:
    cpu: "10m"
    memory: "32Mi"
  limits:
    cpu: "50m"
    memory: "64Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

# Configuración de Pruebas de Salud (Probes)
probes:
  liveness:
    path: "/"
    port: 80
  readiness:
    path: "/"
    port: 80
